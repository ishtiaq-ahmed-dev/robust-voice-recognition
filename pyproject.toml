[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "speech_sense"
version = "0.2.0"
description = "Portfolio-grade speaker verification with VAD, confidence scoring, evaluation harness and REST API"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Ishtiaq Ahmed" }]
requires-python = ">=3.10"
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "librosa>=0.10",
  "soundfile>=0.12",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
  "seaborn>=0.12",
]

[project.optional-dependencies]
model = ["resemblyzer>=0.1.4"]
api = ["fastapi>=0.100", "uvicorn[standard]>=0.23", "python-multipart>=0.0.6"]
dev = ["pytest>=7", "pytest-cov>=4", "httpx>=0.25", "onnxruntime>=1.16"]
mic = ["sounddevice>=0.4"]

[project.scripts]
speech-sense = "speech_sense.cli:main"

[project.urls]
Homepage = "https://github.com/ishtiaq-ahmed-dev/robust-voice-recognition"
Repository = "https://github.com/ishtiaq-ahmed-dev/robust-voice-recognition"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# web/assets/* matters: without it an installed wheel ships the dashboard
# markup but none of its images, including the logo the whole UI sits on.
speech_sense = ["web/*.html", "web/*.js", "web/*.css", "web/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
  "needs_model: requires resemblyzer model download",
]
